
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheckFiber | Operador</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body data-restrito="true">

    <header>
        <h1>CheckFiber</h1>
        <p>Painel do operador</p>
    </header>

    <main class="container">

        <nav>
            <a href="historico.html" class="btn">Histórico</a>
            <button class="btn vermelho" onclick="sair()">Sair</button>
        </nav>

        <section class="card">

            <h2>Cadastrar material</h2>

            <form id="formMaterial">

                <label for="nomeMaterial">Nome do material</label>
                <input type="text" id="nomeMaterial"
                       placeholder="Ex.: Conector SC/APC" required>

                <label for="quantidadeMaterial">Quantidade necessária</label>
                <input type="number" id="quantidadeMaterial"
                       min="1" step="1" required>

                <button type="submit" class="btn verde">
                    + Adicionar material
                </button>

            </form>

        </section>

        <section class="card">

            <h2>Materiais cadastrados</h2>

            <div id="listaMateriais"></div>

        </section>

        <section class="card">

            <h2>Compartilhar conferência</h2>

            <p class="subtitulo">
                Envie o link para os técnicos realizarem a conferência.
            </p>

            <input type="text" id="linkConferencia" readonly>

            <button class="btn" onclick="copiarLink()">
                Copiar link
            </button>

            <p id="mensagem" class="mensagem" role="status"></p>

        </section>

    </main>

    <footer>CheckFiber © 2026</footer>

</body>
</html>
