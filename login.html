
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheckFiber | Login</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>

    <header>
        <h1>CheckFiber</h1>
        <p>Controle diário de materiais</p>
    </header>

    <main class="container login">

        <section class="card">

            <h2>Área do operador</h2>
            <p class="subtitulo">Entre para gerenciar as conferências.</p>

            <form id="formLogin">

                <label for="usuario">Usuário</label>
                <input type="text" id="usuario"
                       placeholder="Digite seu usuário" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha"
                       placeholder="Digite sua senha" required>

                <button type="submit" class="btn">Entrar</button>

                <p id="mensagem" class="mensagem" role="status"></p>

            </form>

            <a class="link" href="index.html">Voltar para conferência</a>

        </section>

    </main>

    <footer>CheckFiber © 2026</footer>

</body>
</html>
